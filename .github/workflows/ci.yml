name: CI

on:
  push:
    branches: [main, docs/living-contracts]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          version: 1.66.0

      # The same pinned API revision the image build generates from.
      - name: Generate protobuf bindings
        run: buf generate --include-imports

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build ./...
