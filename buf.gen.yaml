version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/agynio/agents/.gen/go

# The API is pinned to one revision so every build generates the same bindings.
# These packages at this revision match upstream agynio/api d524d3a.
inputs:
  - git_repo: https://github.com/spk-ai/api.git
    ref: f62e2ad47a5ea5451d88c3cc0138f73be708eb55
    subdir: proto
    paths:
      - agynio/api/agents/v1
      - agynio/api/authorization/v1
      - agynio/api/identity/v1
      - agynio/api/images/v1
      - agynio/api/notifications/v1
      - agynio/api/organizations/v1

plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: .gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.6.1
    out: .gen/go
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
